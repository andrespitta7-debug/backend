<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SysQuest - Videojuego RPG Educativo de Ingeniería de Sistemas">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SysQuest">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SysQuest - RPG Educativo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0F111A;
      color: #E2E8F0;
      font-family: 'Press Start 2P', monospace, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #sysquest-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      z-index: 9999;
    }

    .splash-card {
      background: #1A1D2C;
      border: 3px solid #35E88E;
      box-shadow: 0 0 24px rgba(53, 232, 142, 0.25), inset 0 0 12px rgba(53, 232, 142, 0.1);
      padding: 36px 32px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 380px;
    }

    .splash-badge {
      font-size: 10px;
      letter-spacing: 2px;
      color: #35E88E;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .splash-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #FFD15C;
      text-shadow: 0 0 16px rgba(255, 209, 92, 0.45);
      margin-bottom: 24px;
    }

    .retro-loader-track {
      width: 200px;
      height: 12px;
      background: #0F111A;
      border: 2px solid #FFD15C;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
    }

    .retro-loader-fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #35E88E, #FFD15C);
      position: absolute;
      animation: retro-anim 1.2s infinite ease-in-out;
    }

    @keyframes retro-anim {
      0% { left: -45%; width: 25%; }
      50% { left: 35%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }

    .splash-status {
      font-size: 9px;
      line-height: 1.6;
      color: #94A3B8;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="sysquest-splash">
    <div class="splash-card">
      <div class="splash-badge">★ RPG EDUCATIVO ★</div>
      <div class="splash-title">SYSQUEST</div>
      <div class="retro-loader-track">
        <div class="retro-loader-fill"></div>
      </div>
      <div class="splash-status">INICIANDO ENTORNO...<br>CARGANDO QUESTS</div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
